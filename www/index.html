<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pixel Camera</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#9aa0a6;--acc:#8ab4f8;--panel:#202124}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Google Sans",Roboto,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;height:56px}
.ib{background:none;border:0;color:var(--fg);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer}
.ib.on{background:#3c4043;color:var(--acc)}
.ib:focus-visible,.mode:focus-visible,#shutter:focus-visible,.z:focus-visible{outline:2px solid var(--acc)}
#stage{position:relative;flex:1;border-radius:24px;overflow:hidden;background:#111;margin:0 6px;min-height:0}
#stage.r34{aspect-ratio:3/4;flex:none;align-self:center;max-height:100%;width:100%}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:
linear-gradient(#fff4 1px,transparent 1px) 0 33.3%/100% 33.3%,linear-gradient(90deg,#fff4 1px,transparent 1px) 33.3% 0/33.3% 100%}
#grid.on{display:block}
#focus{position:absolute;width:70px;height:70px;border:2px solid #fff;border-radius:50%;opacity:0;pointer-events:none;transform:scale(1.4);transition:.25s}
#focus.go{opacity:1;transform:scale(1)}
#zoomBox{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0008;padding:5px;border-radius:24px;backdrop-filter:blur(8px);z-index:2}
.z{border:0;background:none;color:#fff;min-width:38px;height:38px;border-radius:50%;font-size:13px;cursor:pointer}
.z.on{background:#fff;color:#000;font-weight:700}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:300;text-shadow:0 2px 12px #0008;pointer-events:none}
#rec{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#d93025;padding:4px 12px;border-radius:14px;font-size:14px;display:none}
#panel{position:absolute;bottom:0;left:0;right:0;background:var(--panel);padding:14px 16px 70px;border-radius:20px 20px 0 0;display:none;z-index:3}
#panel.open{display:block}
#panel label{display:flex;align-items:center;gap:10px;font-size:14px;margin:8px 0;color:var(--dim)}
#panel input[type=range]{flex:1;accent-color:var(--acc)}
#panel select{background:#3c4043;color:#fff;border:0;border-radius:8px;padding:6px}
#modes{display:flex;justify-content:center;gap:22px;padding:12px 0 4px;overflow-x:auto}
.mode{background:none;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:6px 4px;white-space:nowrap}
.mode.on{color:var(--fg);font-weight:600;border-bottom:2px solid var(--acc)}
#bar{display:flex;align-items:center;justify-content:space-around;padding:8px 20px 16px}
#thumb{width:52px;height:52px;border-radius:50%;border:2px solid #5f6368;background:#202124 center/cover;cursor:pointer}
#shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer;transition:transform .1s}
#shutter:active{transform:scale(.9)}
#shutter.vid{background:#d93025}
#shutter.recording{border-radius:18px;transform:scale(.8)}
#gal{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#gal.open{display:flex}
#gal .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
#gl{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;align-content:start}
#gl img,#gl video{position:static;width:100%;height:auto;aspect-ratio:1;object-fit:cover;cursor:pointer}
#msg{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#3c4043;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:20;max-width:90%;text-align:center}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bFlash" title="Flash" aria-label="Flash">&#9889;</button>
    <button class="ib" id="bTimer" title="Timer" aria-label="Timer">&#9201;</button>
    <button class="ib" id="bGrid" title="Grid" aria-label="Grid">#</button>
    <button class="ib" id="bRatio" title="Aspect ratio" aria-label="Aspect ratio">&#9974;</button>
    <button class="ib" id="bSet" title="Settings" aria-label="Settings">&#9881;</button>
  </div>
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c" hidden></canvas>
    <div id="grid"></div><div id="focus"></div><div id="count"></div><div id="rec">&#9679; 00:00</div><div id="flash"></div>
    <div id="zoomBox">
      <button class="z" data-z="0.5">.5</button>
      <button class="z on" data-z="1">1&times;</button>
      <button class="z" data-z="2">2&times;</button>
      <button class="z" data-z="5">5&times;</button>
    </div>
    <div id="panel">
      <label>Brightness <input type="range" id="sB" min="60" max="160" value="100"></label>
      <label>Contrast <input type="range" id="sC" min="60" max="160" value="100"></label>
      <label>Saturation <input type="range" id="sS" min="0" max="200" value="100"></label>
      <label>Filter
        <select id="fx">
          <option value="">Original</option>
          <option value="grayscale(1)">Black &amp; white</option>
          <option value="sepia(.8)">Sepia</option>
          <option value="saturate(1.6) contrast(1.1)">Vivid</option>
          <option value="hue-rotate(20deg) saturate(1.2)">Warm</option>
          <option value="hue-rotate(-20deg) brightness(1.05)">Cool</option>
        </select>
      </label>
      <label><input type="checkbox" id="mirror"> Mirror front camera photos</label>
    </div>
  </div>
  <div id="modes">
    <button class="mode" data-m="night">Night Sight</button>
    <button class="mode" data-m="portrait">Portrait</button>
    <button class="mode on" data-m="photo">Photo</button>
    <button class="mode" data-m="video">Video</button>
  </div>
  <div id="bar">
    <div id="thumb" role="button" tabindex="0" aria-label="Open gallery"></div>
    <button id="shutter" aria-label="Shutter"></button>
    <button class="ib" id="bFlip" aria-label="Switch camera" style="width:52px;height:52px;background:#3c4043">&#10226;</button>
  </div>
</div>

<div id="gal">
  <div class="hd"><b>Gallery</b><button class="ib" id="gx" aria-label="Close gallery">&#10005;</button></div>
  <div id="gl"></div>
</div>
<div id="msg" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const v = $('#v'), c = $('#c');
  const cap = window.Capacitor;
  const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());

  let stream, ic = null, facing = 'environment', mode = 'photo';
  let zoom = 1, softZoom = 1, torch = false, timer = 0, ratio = 'full';
  let rec = null, chunks = [], recT = null, items = [], busy = false;

  function say(t) {
    const m = $('#msg');
    m.textContent = t;
    m.style.display = 'block';
    clearTimeout(say.t);
    say.t = setTimeout(() => { m.style.display = 'none'; }, 2600);
  }
  const track = () => (stream ? stream.getVideoTracks()[0] : null);
  const caps = () => { try { return track().getCapabilities(); } catch (e) { return {}; } };
  const isMirror = () => facing === 'user' && $('#mirror').checked;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const gum = o => navigator.mediaDevices.getUserMedia(o);

  function filterStr() {
    let f = `brightness(${$('#sB').value}%) contrast(${$('#sC').value}%) saturate(${$('#sS').value}%) ${$('#fx').value}`;
    if (mode === 'night') f += ' brightness(1.35) contrast(1.1)';
    if (mode === 'portrait') f += ' contrast(1.08) saturate(1.1)';
    return f;
  }
  function applyFilter() {
    v.style.filter = filterStr();
    v.style.transform = (isMirror() ? 'scaleX(-1) ' : '') + `scale(${softZoom})`;
  }

  async function start() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    torch = false;
    $('#bFlash').classList.remove('on');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('Camera is not supported here. Use HTTPS or the app.');
      return;
    }
    ic = ('ImageCapture' in window) ? 1 : null;
    const big = mode !== 'video' && !ic;
    const vid = { facingMode: facing, width: { ideal: big ? 4096 : 1920 }, height: { ideal: big ? 3072 : 1080 } };
    try {
      stream = await gum({ video: vid, audio: mode === 'video' });
    } catch (e) {
      try {
        stream = await gum({ video: vid, audio: false });
        if (mode === 'video') say('Microphone unavailable. Recording without sound.');
      } catch (e2) {
        say('Could not start the camera. Please allow camera permission.');
        return;
      }
    }
    v.srcObject = stream;
    if (ic) { try { ic = new ImageCapture(track()); } catch (e) { ic = null; } }
    setZoom(1);
  }

  function setZoom(z) {
    const cp = caps();
    if (z < 1 && !(cp.zoom && cp.zoom.min <= z)) { say('Ultra-wide is not available on this camera'); z = 1; }
    zoom = z; softZoom = 1;
    if (cp.zoom) {
      const t = Math.min(Math.max(z, cp.zoom.min), cp.zoom.max);
      track().applyConstraints({ advanced: [{ zoom: t }] }).catch(() => {});
      if (z > cp.zoom.max) softZoom = z / cp.zoom.max;
    } else {
      softZoom = Math.max(1, z);
    }
    document.querySelectorAll('.z').forEach(b => b.classList.toggle('on', +b.dataset.z === z));
    applyFilter();
  }
  document.querySelectorAll('.z').forEach(b => { b.onclick = () => setZoom(+b.dataset.z); });

  let pd = 0;
  $('#stage').addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pd) setZoom(Math.min(8, Math.max(1, zoom * d / pd)));
      pd = d;
    }
  }, { passive: true });
  $('#stage').addEventListener('touchend', () => { pd = 0; });

  $('#stage').addEventListener('click', e => {
    if (e.target.closest('#zoomBox,#panel')) return;
    const r = $('#stage').getBoundingClientRect(), f = $('#focus');
    f.style.left = (e.clientX - r.left - 35) + 'px';
    f.style.top = (e.clientY - r.top - 35) + 'px';
    f.classList.add('go');
    setTimeout(() => f.classList.remove('go'), 900);
    $('#panel').classList.remove('open');
  });

  document.querySelectorAll('.mode').forEach(b => {
    b.onclick = async () => {
      if (rec && rec.state === 'recording') return;
      const was = mode;
      mode = b.dataset.m;
      document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b));
      $('#shutter').classList.toggle('vid', mode === 'video');
      if ((was === 'video') !== (mode === 'video')) await start(); else applyFilter();
    };
  });

  $('#bFlip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };
  $('#bFlash').onclick = async () => {
    if (!caps().torch) { say('Flash is not available on this camera'); return; }
    torch = !torch;
    try { await track().applyConstraints({ advanced: [{ torch }] }); } catch (e) { torch = false; }
    $('#bFlash').classList.toggle('on', torch);
  };
  $('#bTimer').onclick = () => {
    timer = timer === 0 ? 3 : timer === 3 ? 10 : 0;
    $('#bTimer').classList.toggle('on', timer > 0);
    $('#bTimer').textContent = timer ? timer + 's' : '\u23F1';
    say(timer ? `Timer ${timer} seconds` : 'Timer off');
  };
  $('#bGrid').onclick = () => { $('#grid').classList.toggle('on'); $('#bGrid').classList.toggle('on'); };
  $('#bRatio').onclick = () => {
    ratio = ratio === 'full' ? 'r34' : 'full';
    $('#stage').classList.toggle('r34', ratio === 'r34');
    $('#bRatio').classList.toggle('on', ratio === 'r34');
    say(ratio === 'r34' ? 'Ratio 3:4' : 'Ratio full screen');
  };
  $('#bSet').onclick = () => $('#panel').classList.toggle('open');
  ['sB', 'sC', 'sS', 'fx', 'mirror'].forEach(id => $('#' + id).addEventListener('input', applyFilter));

  // Get the best source for a still: full-resolution takePhoto(), averaged frames (night), or a video frame.
  async function grab() {
    if (mode === 'night') {
      const n = 6, a = document.createElement('canvas');
      a.width = v.videoWidth; a.height = v.videoHeight;
      const ax = a.getContext('2d');
      for (let i = 0; i < n; i++) {
        ax.globalAlpha = 1 / (i + 1);
        ax.drawImage(v, 0, 0);
        await wait(120);
      }
      return { src: a, w: a.width, h: a.height };
    }
    if (ic && ic.takePhoto) {
      try {
        const bm = await createImageBitmap(await ic.takePhoto());
        return { src: bm, w: bm.width, h: bm.height };
      } catch (e) { /* fall back to a video frame */ }
    }
    return { src: v, w: v.videoWidth, h: v.videoHeight };
  }

  async function snap() {
    if (busy) return;
    if (!v.videoWidth) { say('Camera is not ready yet'); return; }
    busy = true;
    try {
      if (mode === 'night') say('Hold still...');
      const g = await grab(), w = g.w, h = g.h;
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.save();
      if (isMirror()) { x.translate(w, 0); x.scale(-1, 1); }
      x.filter = filterStr();
      const s = softZoom;
      x.drawImage(g.src, w * (1 - 1 / s) / 2, h * (1 - 1 / s) / 2, w / s, h / s, 0, 0, w, h);
      x.restore();
      if (g.src.close) g.src.close();

      if (mode === 'portrait') {
        const b = document.createElement('canvas');
        b.width = w; b.height = h;
        const bx = b.getContext('2d');
        bx.filter = `blur(${Math.max(6, Math.round(w / 120))}px)`;
        bx.drawImage(c, 0, 0);
        bx.filter = 'none';
        bx.globalCompositeOperation = 'destination-in';
        const mg = bx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.28, w / 2, h / 2, Math.max(w, h) * 0.6);
        mg.addColorStop(0, 'rgba(0,0,0,0)');
        mg.addColorStop(1, 'rgba(0,0,0,1)');
        bx.fillStyle = mg;
        bx.fillRect(0, 0, w, h);
        x.drawImage(b, 0, 0);
      }
      if (ratio === 'r34') {
        const nw = Math.min(w, h * 3 / 4), nh = nw * 4 / 3;
        const t = document.createElement('canvas');
        t.width = nw; t.height = nh;
        t.getContext('2d').drawImage(c, (w - nw) / 2, 0, nw, nh, 0, 0, nw, nh);
        c.width = nw; c.height = nh;
        c.getContext('2d').drawImage(t, 0, 0);
      }
      const f = $('#flash');
      f.style.transition = 'none'; f.style.opacity = 0.8;
      requestAnimationFrame(() => { f.style.transition = 'opacity .3s'; f.style.opacity = 0; });
      await new Promise(r => c.toBlob(b => { if (b) add(b, 'image'); else say('Could not save the photo'); r(); }, 'image/jpeg', 0.95));
    } catch (e) {
      say('Capture failed. Please try again.');
    } finally {
      busy = false;
    }
  }

  function add(blob, type) {
    const url = URL.createObjectURL(blob);
    items.unshift({ url, type, blob });
    $('#thumb').style.backgroundImage = type === 'image' ? `url(${url})` : 'none';
    say(type === 'image' ? 'Photo captured' : 'Video recorded');
  }

  function countdown(n, cb) {
    const el = $('#count');
    el.style.display = 'flex';
    el.textContent = n;
    const i = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(i); el.style.display = 'none'; cb(); } else el.textContent = n;
    }, 1000);
  }

  function startRec() {
    chunks = [];
    const types = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const mt = window.MediaRecorder ? types.find(t => MediaRecorder.isTypeSupported(t)) : null;
    try { rec = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream); }
    catch (e) { say('Video recording is not supported here'); return; }
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearInterval(recT);
      $('#rec').style.display = 'none';
      $('#shutter').classList.remove('recording');
      if (chunks.length) add(new Blob(chunks, { type: rec.mimeType || 'video/webm' }), 'video');
    };
    rec.start(1000);
    $('#shutter').classList.add('recording');
    $('#rec').style.display = 'block';
    let s = 0;
    $('#rec').textContent = '\u25CF 00:00';
    recT = setInterval(() => {
      s++;
      $('#rec').textContent = '\u25CF ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);
  }

  $('#shutter').onclick = () => {
    if (mode === 'video') {
      if (rec && rec.state === 'recording') { rec.stop(); return; }
      timer ? countdown(timer, startRec) : startRec();
    } else {
      timer ? countdown(timer, snap) : snap();
    }
  };

  // Save / share a file. In the Android app this opens the share sheet (Save to Photos, Drive, etc.).
  const toB64 = blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('read failed'));
    r.readAsDataURL(blob);
  });
  async function exportItem(it) {
    const ext = it.type === 'image' ? '.jpg' : (it.blob.type.includes('mp4') ? '.mp4' : '.webm');
    const name = (it.type === 'image' ? 'pixel-photo-' : 'pixel-video-') + Date.now() + ext;
    const P = cap && cap.Plugins;
    if (native && P && P.Filesystem && P.Share) {
      try {
        const r = await P.Filesystem.writeFile({ path: name, data: await toB64(it.blob), directory: 'CACHE' });
        await P.Share.share({ title: name, files: [r.uri] });
      } catch (e) {
        if (!/cancel/i.test(String(e && (e.message || e)))) say('Could not save the file');
      }
      return;
    }
    const a = document.createElement('a');
    a.href = it.url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function openGal() {
    const g = $('#gl');
    g.innerHTML = '';
    if (!items.length) {
      const p = document.createElement('p');
      p.style.cssText = 'grid-column:1/-1;text-align:center;color:#9aa0a6;padding:40px';
      p.textContent = 'No photos or videos yet. Press the shutter to capture.';
      g.appendChild(p);
    }
    items.forEach(it => {
      const e = document.createElement(it.type === 'image' ? 'img' : 'video');
      e.src = it.url;
      if (it.type === 'video') e.muted = true;
      e.onclick = () => exportItem(it);
      g.appendChild(e);
    });
    $('#gal').classList.add('open');
    if (items.length) say('Tap an item to save or share it');
  }
  $('#thumb').onclick = openGal;
  $('#thumb').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') openGal(); };
  $('#gx').onclick = () => $('#gal').classList.remove('open');

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (rec && rec.state === 'recording') rec.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
    } else {
      start();
    }
  });

  start();
})();
</script>
</body>
</html>
